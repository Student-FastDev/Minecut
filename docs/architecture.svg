<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 1530" role="img" aria-labelledby="title desc"><title id="title">Minecut model computation graph</title><desc id="desc">Parallel global, detail, audio, and motion branches feed gated audio visual fusion, recurrent context, event and category heads, then native-frame sequence decoding.</desc><defs><pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse"><path d="M32 0H0V32" fill="none" stroke="#fff" stroke-opacity=".025"/></pattern><marker id="arrow" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0 0L9 4.5L0 9z" fill="#9ab585"/></marker><style>text{font-family:Consolas,Monaco,monospace;fill:#e8eee2}.title{font-size:35px;font-weight:700;letter-spacing:1px}.subtitle{font-size:18px;fill:#bac7ad}.section{font-size:15px;fill:#91aa78;letter-spacing:2px;font-weight:bold}.boxTitle{font-size:20px;font-weight:bold}.detail{font-size:16px;fill:#d4dcd0}.shape{font-size:16px;fill:#afcfe1}.note{font-size:15px;fill:#aab5a1}.box{fill:#273127;stroke:#718760;stroke-width:3}.audio{fill:#302c23;stroke:#9a8767;stroke-width:3}.motion{fill:#222d31;stroke:#65878d;stroke-width:3}.output{fill:#292d27;stroke:#a1b486;stroke-width:3}.arrow{fill:none;stroke:#9ab585;stroke-width:3;marker-end:url(#arrow)}.rail{fill:none;stroke:#9ab585;stroke-width:3}</style></defs><rect width="1600" height="1530" fill="#161d19"/><rect width="1600" height="1530" fill="url(#grid)"/><path d="M20 20H1580V1510H20Z" fill="none" stroke="#718760" stroke-width="4"/><rect x="22" y="22" width="1556" height="8" fill="#a4b890"/><text x="64" y="78" class="title">MINECUT  /  MODEL COMPUTATION GRAPH</text><text x="64" y="115" class="subtitle">PyTorch inference  ·  B = batch  ·  T = 96 source frames  ·  D = 368</text><text x="60" y="160" class="section">01  SOURCE FEATURES  /  FOUR PARALLEL INPUT LANES</text><rect x="66" y="186" width="350" height="165" fill="#080d09" opacity=".7"/><rect x="60" y="180" width="350" height="165" class="box"/><text x="78" y="212" class="boxTitle">GLOBAL VIDEO</text><text x="78" y="242" class="detail">224 × 128 view from source</text><text x="78" y="266" class="detail">Every 2nd frame  ·  RegNetY-002</text><text x="78" y="290" class="detail">Gate-Shift-Fuse modules</text><text x="78" y="314" class="shape">B × 48 × 368 → B × 96 × 368</text><rect x="436" y="186" width="350" height="165" fill="#080d09" opacity=".7"/><rect x="430" y="180" width="350" height="165" class="box"/><text x="448" y="212" class="boxTitle">CENTRE DETAIL</text><text x="448" y="242" class="detail">160 × 160 fixed central crop</text><text x="448" y="266" class="detail">Every 2nd frame  ·  RegNetY-002</text><text x="448" y="290" class="detail">Gate-Shift-Fuse modules</text><text x="448" y="314" class="shape">B × 48 × 368 → B × 96 × 368</text><rect x="806" y="186" width="350" height="165" fill="#080d09" opacity=".7"/><rect x="800" y="180" width="350" height="165" class="audio"/><text x="818" y="212" class="boxTitle">AUDIO ENCODER</text><text x="818" y="242" class="detail">16 kHz mono  ·  64 log-mel bands</text><text x="818" y="266" class="detail">25 ms STFT  ·  10 ms hop</text><text x="818" y="290" class="detail">Conv1d: 64 → 96 → 368</text><text x="818" y="314" class="shape">B × 96 × 368  ·  PTS-aligned</text><rect x="1176" y="186" width="370" height="165" fill="#080d09" opacity=".7"/><rect x="1170" y="180" width="370" height="165" class="motion"/><text x="1188" y="212" class="boxTitle">NATIVE MOTION</text><text x="1188" y="242" class="detail">All proxy frames  ·  40 × 96</text><text x="1188" y="266" class="detail">RGB + previous-frame difference</text><text x="1188" y="290" class="detail">3 × Conv2d + adaptive pool</text><text x="1188" y="314" class="shape">B × 96 × 64</text><rect x="66" y="436" width="1090" height="150" fill="#080d09" opacity=".7"/><rect x="60" y="430" width="1090" height="150" class="box"/><text x="78" y="462" class="boxTitle">VISUAL PROJECTION + AUDIO GATE</text><text x="78" y="492" class="detail">v = max(MLP(global), MLP(detail))</text><text x="78" y="516" class="detail">g = sigmoid(W[v, audio, mask]) × mask</text><text x="78" y="540" class="shape">fused = v + g ⊙ audio  ·  B × 96 × 368</text><rect x="1176" y="436" width="370" height="150" fill="#080d09" opacity=".7"/><rect x="1170" y="430" width="370" height="150" class="motion"/><text x="1188" y="462" class="boxTitle">MOTION FEATURES</text><text x="1188" y="492" class="detail">64 features per source frame</text><text x="1188" y="516" class="detail">Passed to the event head</text><text x="1188" y="540" class="shape">B × 96 × 64</text><path class="arrow" d="M235 345L235 430"/><path class="arrow" d="M605 345L605 430"/><path class="arrow" d="M975 345L975 430"/><path class="arrow" d="M1355 345L1355 430"/><rect x="66" y="671" width="1090" height="140" fill="#080d09" opacity=".7"/><rect x="60" y="665" width="1090" height="140" class="box"/><text x="78" y="697" class="boxTitle">BIDIRECTIONAL GRU</text><text x="78" y="727" class="detail">[fused, source fps / 60] → GRU(369, 368)</text><text x="78" y="751" class="detail">368 hidden units × 2 directions</text><text x="78" y="775" class="shape">B × 96 × 736</text><rect x="1176" y="671" width="370" height="140" fill="#080d09" opacity=".7"/><rect x="1170" y="665" width="370" height="140" class="motion"/><text x="1188" y="697" class="boxTitle">MOTION SKIP</text><text x="1188" y="727" class="detail">Full-rate visual evidence</text><text x="1188" y="751" class="detail">Feeds event head below</text><text x="1188" y="775" class="shape">B × 96 × 64</text><path class="arrow" d="M605 580L605 665"/><path class="arrow" d="M1355 580L1355 665"/><rect x="66" y="896" width="720" height="175" fill="#080d09" opacity=".7"/><rect x="60" y="890" width="720" height="175" class="motion"/><text x="78" y="922" class="boxTitle">ACTION-CONDITIONED CATEGORY</text><text x="78" y="952" class="detail">GRU 736 + shifted detail 368 → MLP → 8</text><text x="78" y="976" class="detail">Break uses detail(t−2), place uses detail(t+2)</text><text x="78" y="1000" class="detail">Adds Linear(256 → 16) from event head</text><text x="78" y="1024" class="shape">B × 96 × 2 actions × 8 classes</text><rect x="826" y="896" width="720" height="175" fill="#080d09" opacity=".7"/><rect x="820" y="890" width="720" height="175" class="box"/><text x="838" y="922" class="boxTitle">NATIVE-FRAME EVENT HEAD</text><text x="838" y="952" class="detail">GRU 736 + detail skip 368 + motion 64 = 1168</text><text x="838" y="976" class="detail">1×1 Conv1d 1168 → 256</text><text x="838" y="1000" class="detail">4 residual temporal blocks  ·  dilation 1 / 2 / 4 / 8</text><text x="838" y="1024" class="shape">B × 96 × 2 action logits</text><path class="arrow" d="M420 805L420 890"/><path class="arrow" d="M975 805L975 890"/><path class="arrow" d="M1355 805L1355 890"/><rect x="66" y="1156" width="1480" height="150" fill="#080d09" opacity=".7"/><rect x="60" y="1150" width="1480" height="150" class="audio"/><text x="78" y="1182" class="boxTitle">48-FRAME CORE ASSEMBLY + RUN COLLAPSE</text><text x="78" y="1212" class="detail">Keep [24, 72) per 96-frame window. Stitch cores into continuous action / category streams.</text><text x="78" y="1236" class="detail">Sigmoid action logits → threshold 0.6 → collapse contiguous positive runs for each action.</text><text x="78" y="1260" class="detail">Take highest-confidence frame in each run and the category argmax for that frame and action.</text><text x="78" y="1284" class="shape">Result: source frame, timestamp, break / place, broad block category, confidence</text><path class="arrow" d="M420 1065L420 1150"/><path class="arrow" d="M1180 1065L1180 1150"/><rect x="66" y="1371" width="1480" height="100" fill="#080d09" opacity=".7"/><rect x="60" y="1365" width="1480" height="100" class="output"/><text x="78" y="1397" class="boxTitle">EDITORIAL CUTTING  /  OUTSIDE THE MODEL</text><text x="78" y="1427" class="detail">Optional peak-audio alignment → duplicate selection → sampling / pacing → Premiere XML</text><text x="78" y="1451" class="shape">No fixed event limit. Skip inputs to heads are labelled in their boxes to keep the graph legible.</text><path class="arrow" d="M800 1300L800 1365"/><text x="65" y="1490" class="note">Fixed centre crop, not AdaSpot’s learned adaptive ROI. Model references and implementation details are in the README.</text></svg>